<style>
:root{
  /* Sweet Home palette: Blue Slate #4F6D7A, Space Indigo #1B1B3A, Ash Grey #B2BCAA, Lobster Pink #C1666B, logo sage #668263 */
  --paper:#FAF6EE; --card:#FFFDF8; --ink:#1B1B3A; --soft:#676A7E; --line:#E4E4D8; --ash:#B2BCAA;
  --a:#4F6D7A; --b:#C1666B; --both:#668263; --on-both:#FFFFFF;
  --a-t:#E3EBEE; --b-t:#F6E3E2; --both-t:#E7EEDF; --honey-ink:#52704F; --danger:#A94B51;
  --shadow:0 10px 24px -14px rgba(27,27,58,.28);
  --display:'Margin', 'Bodoni Moda', Didot, 'Bodoni 72', Georgia, serif;
  --body:'Montserrat', -apple-system, system-ui, sans-serif;
}
:root[data-theme="dark"]{
  --paper:#1B1B3A; --card:#25264A; --ink:#F4EFE4; --soft:#A7ABC0; --line:#36375E; --ash:#5E6758;
  --a:#86A4B1; --b:#D98A8E; --both:#8FAA86; --on-both:#1B1B3A; --danger:#E08C90;
  --a-t:#2A3B4B; --b-t:#46293B; --both-t:#2C3C38; --honey-ink:#A9C49F; --shadow:0 10px 24px -14px rgba(0,0,0,.7);
}
@font-face{font-family:'Margin';src:local('Margin'),local('Margin Regular'),url('margin.woff2') format('woff2');font-display:swap}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1B1B3A; --card:#25264A; --ink:#F4EFE4; --soft:#A7ABC0; --line:#36375E; --ash:#5E6758;
    --a:#86A4B1; --b:#D98A8E; --both:#8FAA86; --on-both:#1B1B3A; --danger:#E08C90;
    --a-t:#2A3B4B; --b-t:#46293B; --both-t:#2C3C38; --honey-ink:#A9C49F; --shadow:0 10px 24px -14px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{background-image:radial-gradient(color-mix(in srgb,var(--ash) 45%,transparent) 1.1px,transparent 1.3px);background-size:22px 22px;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
.app{max-width:520px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.hide{display:none!important}

.ob-logo{width:min(300px,80vw);height:auto;display:block;margin:0 auto 6px}
.pair{display:flex}
.pair span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--on-both);border:3px solid var(--paper)}
.pair span+span{margin-left:-10px}

/* hero */
.hero{background:var(--card);border-radius:28px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"♥";position:absolute;right:14px;top:-18px;font-size:92px;color:var(--both);opacity:.12;line-height:1;pointer-events:none}
.hero-k{font-size:14px;color:var(--soft);font-weight:600}
.hero-when{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;margin:4px 0 2px;color:var(--honey-ink)}
.hero-title{font-size:19px;font-weight:700}
.hero-sub{color:var(--soft);font-size:15px}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.chip-days{font-size:13px;font-weight:700;background:var(--both-t);color:var(--ink);padding:5px 11px;border-radius:99px}
.btn{background:var(--ink);color:var(--paper);font-weight:700;border-radius:99px;padding:10px 16px;font-size:15px}
.btn.honey{background:var(--both);color:var(--on-both)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:2px solid currentColor}
.letter{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;background:var(--b-t);border-radius:18px;padding:12px 14px;font-weight:600;text-align:left}
.letter b{font-size:20px}

/* status duo */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.st{background:var(--card);border-radius:22px;padding:12px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.st-top{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;min-width:0}
.st-top span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:26px;height:26px;border-radius:50%;color:var(--on-both);display:grid;place-items:center;font-size:12px;font-weight:700}
.st-s{font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.st-s.empty{color:var(--soft)}
.st-meta{font-size:12.5px;color:var(--soft)}
.send{align-self:flex-start;margin-top:2px;background:var(--b-t);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px}
.st.mine .edit{align-self:flex-start;margin-top:2px;background:var(--a-t);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px}

/* month */
.month{margin-top:18px;background:var(--card);border-radius:28px;padding:14px 12px 12px;box-shadow:var(--shadow)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 6px 8px}
.mhead{gap:8px}
.mtitle{font-family:var(--display);font-weight:600;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:left}
.mnav{flex:none}
.mnav{display:flex;gap:6px}
.mnav button{width:38px;height:38px;border-radius:50%;background:var(--paper);font-size:18px;font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:700;color:var(--soft);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:pan-y}
.day{position:relative;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 4px 7px}
.day .num{font-weight:600;font-size:15px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.out{opacity:.35}
.day.today .num{background:var(--ink);color:var(--paper)}
.day.sel{background:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.day .mark{position:absolute;top:3px;right:4px;font-size:13px;font-weight:700;line-height:1;color:var(--honey-ink)}
.day .mark.us{font-size:14px;color:var(--both)}
.bar{display:flex;gap:3px;width:78%;height:5px}
.bar i{flex:1;border-radius:3px;background:transparent}
.p-a{background:var(--a)!important}.p-b{background:var(--b)!important}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12.5px;color:var(--soft);margin-top:10px}
.key span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.key i{width:14px;height:5px;border-radius:3px;display:inline-block}
.key b{color:var(--honey-ink);font-size:13px}

/* day panel */
.panel{margin-top:18px}
.ptitle{font-family:var(--display);font-weight:600;font-size:22px;margin:0 4px 10px}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--both-t);border-radius:18px;padding:10px 10px 10px 14px;margin-bottom:10px;font-weight:600;font-size:15px}
.nudge .btn{padding:8px 13px;font-size:14px;white-space:nowrap}

/* planner timeline */
.tl-wrap{background:var(--card);border-radius:22px;padding:12px 12px 14px 6px;box-shadow:var(--shadow)}
.tl-h,.tl-ad,.tl{display:grid;grid-template-columns:40px 1fr;gap:6px}
.tl-names{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13.5px;font-weight:700;margin-bottom:8px}
.tl-names span{display:flex;align-items:center;gap:6px;min-width:0;padding-left:4px}
.tl-names em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-names i{flex:none;width:10px;height:10px;border-radius:50%}
.tl-ad{margin-bottom:12px}
.tl-adl{font-size:11px;color:var(--soft);text-align:right;padding-top:6px;line-height:1.2}
.adg{display:grid;grid-template-columns:1fr 1fr;gap:5px 6px;align-items:start}
.adg>div{display:grid;gap:5px;min-width:0}
.ad-sh{grid-column:1/-1}
.chip{display:flex;flex-direction:column;text-align:left;border-radius:10px;padding:5px 8px;font-size:12.5px;line-height:1.25;min-width:0}
.chip b{font-weight:700;overflow-wrap:anywhere}
.chip small{font-size:11.5px;color:var(--soft)}
.chip.a,.blk.a{background:var(--a-t);box-shadow:inset 3px 0 0 var(--a)}
.chip.b,.blk.b{background:var(--b-t);box-shadow:inset 3px 0 0 var(--b)}
.chip.both,.blk.both{background:var(--both-t);box-shadow:inset 0 0 0 2px var(--both)}

function fmtTime(t){ if(!t) return ''; let [h,m] = t.split(':').map(Number); const ap = h>=12 && h<24 ? 'PM' : 'AM'; h = h%12||12; return m ? `${h}:${pad(m)} ${ap}` : `${h} ${ap}`; }
function hourLabel(h){ h = h % 24; return h===0 ? '12 AM' : h===12 ? '12 PM' : h<12 ? `${h} AM` : `${h-12} PM`; }
function fmtDate(ds, opts){ return parse(ds).toLocaleDateString(undefined, opts); }
function relDay(ds){
  const n = daysBetween(todayStr(), ds);
  if(n===0) return 'Today';
  if(n===1) return 'Tomorrow';
  if(n<7) return fmtDate(ds,{weekday:'long'});
  return `In ${n} days`;
}
function merge(a, b){
  const o = {...(a||{})};
  for(const k in b){
    const v = b[k];
    o[k] = (v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object') ? merge(o[k], v) : v;
  }
  return o;
}

/* ============ 4. Storage ============ */
let sharedRef = null, eventsRef = null, ideasRef = null, local = null;
function initStore(){
  if(LOCAL){
    $('#localBanner').classList.remove('hide');
    local = JSON.parse(localStorage.getItem('duet-local') || '{}');
    local.events = local.events || {}; local.settings = local.settings || {}; local.ideas = local.ideas || {};
    state.settings = local.settings; state.events = Object.values(local.events); state.ideas = Object.values(local.ideas);
    state.settingsLoaded = true; render(); return;
  }
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  sharedRef = db.collection('duet').doc('shared');
  eventsRef = sharedRef.collection('events');
  ideasRef = sharedRef.collection('ideas');
  sharedRef.onSnapshot(s => { state.settings = s.data() || {}; state.settingsLoaded = true; render(); },
                       e => toast('Couldn’t reach Firebase: ' + e.code));
  eventsRef.onSnapshot(s => { state.events = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
  ideasRef.onSnapshot(s => { state.ideas = s.docs.map(d => ({id:d.id, ...d.data()})); if(state.view === 'jar') renderJar(); });
}
function persistLocal(){ localStorage.setItem('duet-local', JSON.stringify(local)); }
function saveEvent(ev){
  if(LOCAL){ local.events[ev.id] = ev; persistLocal(); state.events = Object.values(local.events); render(); return; }
  eventsRef.doc(ev.id).set(ev);
}
function deleteEvent(id){
  if(LOCAL){ delete local.events[id]; persistLocal(); state.events = Object.values(local.events); render(); return; }
  eventsRef.doc(id).delete();
}
function saveIdea(idea){
  if(LOCAL){ local.ideas[idea.id] = idea; persistLocal(); state.ideas = Object.values(local.ideas); render(); return; }
  ideasRef.doc(idea.id).set(idea);
}
function deleteIdea(id){
  if(LOCAL){ delete local.ideas[id]; persistLocal(); state.ideas = Object.values(local.ideas); render(); return; }
  ideasRef.doc(id).delete();
}
function saveSettings(patch){
  state.settings = merge(state.settings, patch);
  if(LOCAL){ local.settings = state.settings; persistLocal(); }
  else sharedRef.set(patch, {merge:true});
  render();
}

/* ============ 5. Calendar logic ============ */
const isMultiDay = e => !!(e.endDate && e.endDate > e.date);
const spanOf = e => isMultiDay(e) ? Math.min(daysBetween(e.date, e.endDate), 31) : 0;
const repeats = e => e.repeat && e.repeat !== 'none';
function isStart(e, cs){
  if(cs < e.date || (e.until && cs > e.until)) return false;
  if(!repeats(e)) return cs === e.date;
  const d = parse(cs), s = parse(e.date), diff = daysBetween(e.date, cs);
  switch(e.repeat){
    case 'daily': return true;
    case 'weekdays': return d.getDay() > 0 && d.getDay() < 6;
    case 'weekly': return diff % 7 === 0;
    case 'biweekly': return diff % 14 === 0;
    case 'monthly': return d.getDate() === Math.min(s.getDate(), dim(d));
    case 'yearly': return d.getMonth() === s.getMonth() && d.getDate() === Math.min(s.getDate(), dim(d));
  }
  return cs === e.date;
}
function occStart(e, ds){
  const span = spanOf(e);
  for(let k = 0; k <= span; k++){
    const cs = k ? ymd(addDays(parse(ds), -k)) : ds;
    if(isStart(e, cs)) return cs;
  }
  return null;
}
const occursOn = (e, ds) => occStart(e, ds) !== null;
const isTimed = e => !(e.allDay || isMultiDay(e) || !e.start);
const sortKey = e => isTimed(e) ? e.start : '00:00a';
function eventsOn(ds){ return state.events.filter(e => occursOn(e, ds)).sort((x,y) => sortKey(x) < sortKey(y) ? -1 : 1); }
function busyEvening(list){
  return list.some(e => {
    if(NONBUSY.has(e.kind)) return false;
    if(!isTimed(e)) return true;
    const s = toMin(e.start); let en = e.end ? toMin(e.end) : s + 60; if(en <= s) en = 24*60;
    return s < EVENING[1] && en > EVENING[0];
  });
}
function freeTogether(ds, list){
  const t = todayStr();
  if(ds < t) return false;
  if(ds === t && hhmm(new Date()) > '21:00') return false;
  list = list || eventsOn(ds);
  if(list.some(e => e.who === 'both' && !NONBUSY.has(e.kind))) return false;
  return !busyEvening(list.filter(e => e.who==='a')) && !busyEvening(list.filter(e => e.who==='b'));
}
function nextFreeEvening(){
  for(let i = 0; i < 21; i++){ const ds = ymd(addDays(new Date(), i)); if(freeTogether(ds)) return ds; }
  return state.selected >= todayStr() ? state.selected : todayStr();
}
function allDayText(e, ds){
  if(isMultiDay(e)){
    const os = occStart(e, ds) || e.date, oe = ymd(addDays(parse(os), spanOf(e)));
    if(ds === os && !e.allDay && e.start) return `From ${fmtTime(e.start)}, through ${fmtDate(oe,{month:'short',day:'numeric'})}`;
    return `Through ${fmtDate(oe,{month:'short',day:'numeric'})}`;
  }
  return 'All day';
}
// timed events for a day, plus overnight events carrying over from yesterday
function dayData(ds){
  const list = eventsOn(ds);
  const allDay = list.filter(e => !isTimed(e));
  const timed = list.filter(isTimed).map(e => {
    const s = toMin(e.start); let en = e.end ? toMin(e.end) : s + 60; if(en <= s) en = 24*60;
    return {e, s, en};
  });
  const prev = ymd(addDays(parse(ds), -1));
  const carry = state.events.filter(e => isTimed(e) && e.end && toMin(e.end) < toMin(e.start) && toMin(e.end) > 0 && occursOn(e, prev))
    .map(e => ({e, s:0, en:toMin(e.end), carry:true}));
  return {list, allDay, timed, carry};
}
function layoutCols(items){
  const res = new Map();
  const sorted = [...items].sort((a,b) => a.s - b.s || b.ve - a.ve);
  let cluster = [], end = -1;
  const flush = () => {
    const ends = [];
    cluster.forEach(it => {
      let c = ends.findIndex(x => x <= it.s);
      if(c < 0){ c = ends.length; ends.push(0); }
      ends[c] = it.ve; res.set(it, {col:c});
    });
    cluster.forEach(it => { res.get(it).cols = ends.length; });
    cluster = []; end = -1;
  };
  sorted.forEach(it => { if(cluster.length && it.s >= end) flush(); cluster.push(it); end = Math.max(end, it.ve); });
  flush();
  return res;
}

function render(){
  const keep = ['noteIn','ideaIn'].map(id => [id, document.getElementById(id)?.value || '']);
  renderOnboard();
  const me = meKey(), them = other(me);
  $('#pair').innerHTML = [me, them].map(w => `<span style="background:${colorOf(w)}">${initial(w)}</span>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  ['cal','week','jar','us'].forEach(v => $('#v-'+v).classList.toggle('hide', state.view !== v));
  if(state.view === 'cal'){ renderHero(); renderLetter(); renderDuo(); renderGrid(); renderPanel(); }
  if(state.view === 'week') renderWeek();
  if(state.view === 'jar') renderJar();

  keep.forEach(([id, v]) => { const el = document.getElementById(id); if(el && v && !el.value) el.value = v; });

}

function renderHero(){
  const now = new Date(), nowM = now.getHours()*60 + now.getMinutes();
  let found = null, freeDay = null;
  for(let i = 0; i < 120 && !found; i++){
    const ds = ymd(addDays(now, i));
    const list = eventsOn(ds);
    for(const e of list.filter(x => x.who === 'both' && x.kind !== 'off')){
      if(i === 0 && isTimed(e) && e.end && e.end > e.start && toMin(e.end) <= nowM) continue;
      found = {e, ds}; break;
    }
    if(!freeDay && i < 14 && freeTogether(ds, list)) freeDay = ds;
  }
  const since = state.settings.since;
  const dayCount = since && since <= todayStr() ? daysBetween(since, todayStr()) + 1 : 0;
  const chip = dayCount ? `<span class="chip-days">Day ${dayCount.toLocaleString()} of us</span>` : '<span></span>';
  let body;
  if(found){
    const k = kindOf(found.e);
    const t = !isTimed(found.e) ? fmtDate(found.ds,{weekday:'long',month:'long',day:'numeric'})
            : `${fmtDate(found.ds,{weekday:'long',month:'short',day:'numeric'})} at ${fmtTime(found.e.start)}`;
    body = `<div class="hero-k">Next time together</div>
      <div class="hero-when">${relDay(found.ds)}</div>
      <div class="hero-title">${k.e} ${esc(found.e.title || k.l)}</div>
      <div class="hero-sub">${t}</div>
      <div class="hero-foot">${chip}${freeDay && freeDay < found.ds ? `<button class="btn ghost" data-plan="${freeDay}">Free ${relDay(freeDay).toLowerCase()} too</button>` : ''}</div>`;
  } else if(freeDay){
    body = `<div class="hero-k">Nothing planned together yet</div>
      <div class="hero-when">${relDay(freeDay)}</div>
      <div class="hero-title">You’re both free that evening</div>
      <div class="hero-foot">${chip}<button class="btn honey" data-plan="${freeDay}">Plan a date</button></div>`;
  } else {
    body = `<div class="hero-k">Nothing planned together yet</div>
      <div class="hero-when">Soon?</div>
      <div class="hero-title">Add something you’re both looking forward to</div>
      <div class="hero-foot">${chip}<button class="btn honey" data-plan="${todayStr()}">Plan something</button></div>`;
  }
  $('#hero').innerHTML = body;
}

function chipHTML(e, ds, carry){
  const k = kindOf(e);
  const sub = carry ? `Until ${fmtTime(e.end)} (from last night)` : allDayText(e, ds) + (repeats(e) ? `, ${FREQ_SHORT[e.repeat]}` : '');
  return `<button class="chip ${e.who}" data-id="${e.id}"><b>${k.e} ${esc(e.title || k.l)}</b><small>${sub}</small></button>`;
}

function timelineHTML(ds, px, compact){
  const {allDay, timed, carry} = dayData(ds);
  const me = meKey(), them = other(me);
  let startH = 7, endH = 22;
  timed.forEach(t => { startH = Math.min(startH, Math.floor(t.s/60)); endH = Math.max(endH, Math.ceil(t.en/60)); });
  const r0 = startH*60, r1 = endH*60;
  const carryShown = [], carryStrip = [];
  carry.forEach(c => (c.en > r0 + 15 ? carryShown : carryStrip).push({...c, s:r0}));
  const items = [...timed, ...carryShown];
  const minMin = Math.ceil(22 / px * 60);
  items.forEach(it => { it.ve = Math.min(Math.max(it.en, it.s + minMin), r1); });
  const Lme = layoutCols(items.filter(it => it.e.who === me));
  const Lth = layoutCols(items.filter(it => it.e.who === them));
  const Lsh = layoutCols(items.filter(it => it.e.who === 'both'));
  const y = m => (m - r0) / 60 * px;
  const H = (endH - startH) * px;

  // Overlaps cascade (each later event is indented and drawn on top) so titles stay readable.
  // Shared plans span both lanes and sit above individual events.
  const blk = (it, left, width, z) => {
    const e = it.e, k = kindOf(e), top = y(it.s), h = Math.max(y(it.ve) - top - 2, 18);
    const time = it.carry ? `Until ${fmtTime(e.end)}` : e.end ? `${fmtTime(e.start)} – ${fmtTime(e.end)}` : fmtTime(e.start);
    const title = esc(e.title || k.l);
    return `<button class="blk ${e.who}" data-id="${e.id}" aria-label="${title}, ${time}"
      style="top:${top+1}px;height:${h}px;left:calc(${left}% + 2px);width:calc(${width}% - 4px);z-index:${z}">
      <span class="bt">${k.e} ${title}</span>${h >= 34 ? `<span class="bw">${time}${repeats(e) ? ' ↻' : ''}</span>` : ''}${!compact && h >= 62 && e.note ? `<span class="bn">${esc(e.note)}</span>` : ''}</button>`;
  };
  let blocks = '';
  items.forEach(it => {
    const w = it.e.who;
    if(w === 'both'){ const p = Lsh.get(it); blocks += blk(it, p.col * 10, 100 - p.col * 10, 10 + p.col); return; }
    const mine = w === me, p = (mine ? Lme : Lth).get(it);
    if(!p) return;
    const step = Math.min(12, 30 / Math.max(p.cols - 1, 1));
    blocks += blk(it, (mine ? 0 : 50) + p.col * step, 50 - p.col * step, 2 + p.col);
  });

  let lines = '', labels = '';
  for(let h = startH; h <= endH; h++){
    const t = (h - startH) * px;
    lines += `<i class="tl-l" style="top:${t}px"></i>`;
    labels += `<span style="top:${t}px">${hourLabel(h)}</span>`;
  }
  const band = freeTogether(ds) ? `<button class="tl-band" data-plan="${ds}" style="top:${y(EVENING[0])+1}px;height:${y(EVENING[1])-y(EVENING[0])-2}px">♡ Both free, tap to plan</button>` : '';
  let now = '';
  if(ds === todayStr()){ const d = new Date(), m = d.getHours()*60 + d.getMinutes(); if(m >= r0 && m <= r1) now = `<i class="tl-now" style="top:${y(m)}px"></i>`; }

  const ad = allDay.concat(carryStrip.map(c => ({...c.e, _carry:true})));
  const adOf = w => ad.filter(e => e.who === w).map(e => chipHTML(e, ds, e._carry)).join('');
  const shared = adOf('both');
  const strip = ad.length ? `<div class="tl-ad"><span class="tl-adl">All day</span><div class="adg">${shared ? `<div class="ad-sh">${shared}</div>` : ''}<div>${adOf(me)}</div><div>${adOf(them)}</div></div></div>` : '';
  const sm = statusOf(me), st = statusOf(them);
  return `<div class="tl-wrap">
    <div class="tl-h"><span></span><div class="tl-names">
      <span><i style="background:${colorOf(me)}"></i><em>${esc(nameOf(me))}${sm ? ' ' + esc(sm.emoji || '💬') : ''}</em></span>
      <span><i style="background:${colorOf(them)}"></i><em>${esc(nameOf(them))}${st ? ' ' + esc(st.emoji || '💬') : ''}</em></span>
    </div></div>
    ${strip}
    <div class="tl" style="height:${H}px">
      <div class="tl-times">${labels}</div>
      <div class="tl-body">
        ${lines}<i class="tl-mid"></i>
        <button class="tl-hit" tabindex="-1" aria-label="Add for ${esc(nameOf(me))}" data-hit="${me}" data-ds="${ds}" data-r0="${r0}" data-px="${px}" style="left:0"></button>
        <button class="tl-hit" tabindex="-1" aria-label="Add for ${esc(nameOf(them))}" data-hit="${them}" data-ds="${ds}" data-r0="${r0}" data-px="${px}" style="left:50%"></button>
        ${band}${now}${blocks}
      </div>
    </div>
  </div>`;
}

function renderPanel(){
  const ds = state.selected;
  const nudge = freeTogether(ds) ? `<div class="nudge"><span>♡ You’re both free this evening</span><button class="btn honey" data-plan="${ds}">Plan a date</button></div>` : '';
  $('#panel').innerHTML = `<h2 class="ptitle">${ds === todayStr() ? 'Today' : fmtDate(ds,{weekday:'long',month:'long',day:'numeric'})}</h2>${nudge}${timelineHTML(ds, 46, false)}`;
}

function renderWeek(){
  let html = '';
  for(let i = 0; i < 7; i++){
    const ds = ymd(addDays(new Date(), i));
    const head = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : fmtDate(ds,{weekday:'long'});
    const {list, carry} = dayData(ds);
    const free = freeTogether(ds, list);
    const body = (!list.length && !carry.length)
      ? `<div class="open-day"><span>${free ? '♡ Wide open for both of you' : 'Nothing scheduled'}</span>${free ? `<button class="btn honey" data-plan="${ds}">Plan a date</button>` : ''}</div>`
      : timelineHTML(ds, 28, true);
    html += `<section class="wday"><h3>${head} <small>${fmtDate(ds,{month:'short',day:'numeric'})}</small></h3>${body}</section>`;
  }
  $('#v-week').innerHTML = html;
}

function renderJar(){
  const open = state.ideas.filter(i => !i.done).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const done = state.ideas.filter(i => i.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
  const pool = open.filter(i => state.jarCat === 'any' || i.cat === state.jarCat);
  const catChips = [['any','🎲 Anything'], ...Object.entries(IDEA_CATS).filter(([k]) => open.some(i => i.cat === k)).map(([k,v]) => [k, `${v.e} ${v.l}`])];
  if(!catChips.some(c => c[0] === state.jarCat)) state.jarCat = 'any';
  const p = state.pulled && state.ideas.find(i => i.id === state.pulled && !i.done);
  const ideaRow = (i, isDone) => {
    const c = IDEA_CATS[i.cat] || IDEA_CATS.out;
    return `<div class="idea"><span class="ie" aria-hidden="true">${c.e}</span>
      <div class="ib"><div class="it">${esc(i.text)}</div><div class="iw"><i style="background:${colorOf(i.by)}"></i>${esc(nameOf(i.by))}’s idea</div></div>
      <div class="ia">${isDone
        ? `<button data-idea-back="${i.id}">Put back</button>`
        : `<button data-idea-plan="${i.id}">Plan</button><button data-idea-done="${i.id}" aria-label="Mark done">✓</button><button data-idea-del="${i.id}" aria-label="Delete idea">✕</button>`}</div></div>`;
  };
  $('#v-jar').innerHTML = `
    <section class="card jar-hero">
      <div class="jar-art" aria-hidden="true">🫙</div>
      <div class="jar-count">${open.length ? `${open.length} idea${open.length === 1 ? '' : 's'} in the jar` : 'The jar is empty'}</div>
      <div class="hint" style="margin-top:0">${open.length ? 'Can’t decide? Pull one out.' : 'Add date ideas below, then pull one when you can’t decide.'}</div>
      ${open.length ? `<div class="kinds">${catChips.map(([k,l]) => `<button data-jcat="${k}" class="${state.jarCat === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <button class="btn honey" data-pull style="padding:13px 26px">Pull an idea</button>` : ''}
      ${p ? `<div class="pulled"><div class="pt">${(IDEA_CATS[p.cat]||IDEA_CATS.out).e} ${esc(p.text)}</div>
        <div class="pm">${esc(nameOf(p.by))}’s idea</div>
        <div class="actions"><button class="btn ghost" data-pull>Another one</button><button class="btn" data-idea-plan="${p.id}">Plan it</button></div></div>` : ''}
    </section>
    <section class="card">
      <h2>Add an idea</h2>
      <input class="in" id="ideaIn" maxlength="80" placeholder="Sushi at that new place, picnic at Loose Park…" autocomplete="off">
      <div class="kinds" style="margin-top:10px">${Object.entries(IDEA_CATS).map(([k,v]) => `<button data-icat="${k}" class="${state.ideaCat === k ? 'on' : ''}">${v.e} ${v.l}</button>`).join('')}</div>
      <div class="actions" style="margin-top:12px"><button class="btn" id="ideaAdd">Add to jar</button></div>
    </section>
    ${open.length ? `<section class="card"><h2>In the jar</h2>${open.map(i => ideaRow(i, false)).join('')}</section>` : ''}
    ${done.length ? `<section class="card"><details class="done"><summary>We did these (${done.length})</summary>${done.map(i => ideaRow(i, true)).join('')}</details></section>` : ''}`;
}

function renderUs(){
  const s = state.settings, n = s.note, me = meKey();
  if(n && n.by !== me) localStorage.setItem('duet-note-seen', String(n.at || 0));
  const count = s.since && s.since <= todayStr() ? daysBetween(s.since, todayStr()) + 1 : 0;
  const theme = localStorage.getItem('duet-theme') || 'auto';
  $('#v-us').innerHTML = `
    ${count ? `<section class="card"><div class="big-count">${count.toLocaleString()}</div><div class="hero-sub">days together since ${fmtDate(s.since,{month:'long',day:'numeric',year:'numeric'})}</div></section>` : ''}
    <section class="card">
      <h2>Love note</h2>
      ${n && n.text ? `<div class="note-text">${esc(n.text)}</div><div class="note-by">From ${esc(nameOf(n.by))}, ${new Date(n.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>`
                    : `<div class="hint" style="margin:0 0 10px">No note yet. Leave one and it pops up on their calendar.</div>`}
      <textarea class="in" id="noteIn" maxlength="280" placeholder="Good luck on your shift today…"></textarea>
      <div class="actions" style="margin-top:10px"><button class="btn honey" id="noteSave">Leave note for ${esc(nameOf(other(me)))}</button></div>
    </section>
    <section class="card">
      <h2>Settings</h2>
      <div class="row">
        <div><label class="f" for="s-a">Name</label><input class="in" id="s-a" value="${esc(s.nameA||'')}" maxlength="20"></div>
        <div><label class="f" for="s-b">Name</label><input class="in" id="s-b" value="${esc(s.nameB||'')}" maxlength="20"></div>
      </div>
      <label class="f" for="s-since">Together since</label>
      <input class="in" type="date" id="s-since" value="${esc(s.since||'')}">
      <div class="actions" style="margin-top:12px"><button class="btn" id="s-save">Save settings</button></div>
      <label class="f">On this phone, I’m</label>
      <div class="seg" id="s-me">
        <button data-me="a" class="w-a ${me==='a'?'on':''}">${esc(nameOf('a'))}</button>
        <button data-me="b" class="w-b ${me==='b'?'on':''}">${esc(nameOf('b'))}</button>
      </div>
      <label class="f">Theme</label>
      <div class="seg" id="s-theme">
        ${['auto','light','dark'].map(t => `<button data-theme-pick="${t}" class="${theme===t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}
      </div>
    </section>
    <div class="ver">Sweet Home ${VERSION}</div>`;
}

/* ============ 7. Thinking of you ============ */
function hearts(x, y, count, spread, into){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const glyphs = ['💗','💕','💖','💞'];
  for(let i = 0; i < count; i++){
    const h = document.createElement('span');
    h.className = 'fly'; h.textContent = glyphs[i % glyphs.length];
    h.style.left = (x + (Math.random() - .5) * spread) + 'px';
    h.style.top = y + 'px';
    h.style.setProperty('--x', ((Math.random() - .5) * 120) + 'px');
    h.style.setProperty('--y', (-180 - Math.random() * 260) + 'px');
    h.style.setProperty('--d', (1.6 + Math.random() * 1.4) + 's');
    h.style.setProperty('--s', (16 + Math.random() * 18) + 'px');
    h.style.animationDelay = (Math.random() * .5) + 's';
    if(into) h.style.zIndex = 1;
    (into || document.body).appendChild(h);
    setTimeout(() => h.remove(), 3600);
  }
}
function sendPoke(fromEl){
  const me = meKey(), p = (state.settings.pokes || {})[me];
  const n = p && p.day === todayStr() ? (p.n || 0) + 1 : 1;
  saveSettings({pokes:{[me]:{at:Date.now(), day:todayStr(), n}}});
  if(fromEl){ const r = fromEl.getBoundingClientRect(); hearts(r.left + r.width/2, r.top, 10, 30); }
  toast(`Sent 💗 to ${nameOf(other(me))}`);
}
function checkPoke(){
  if(!state.settingsLoaded || !state.me || !$('#onboard').classList.contains('hide')) return;
  const them = other(meKey()), p = (state.settings.pokes || {})[them];
  const seen = Number(localStorage.getItem('duet-poke-seen') || 0);
  if(!p || !p.at || p.at <= seen || !$('#pokeOv').classList.contains('hide')) return;
  localStorage.setItem('duet-poke-seen', String(p.at));
  $('#pokeTitle').textContent = `${nameOf(them)} is thinking of you`;
  $('#pokeSub').textContent = p.day === todayStr() && p.n > 1 ? `That’s ${p.n} times today` : 'Right now, actually';
  $('#pokeOv').classList.remove('hide');
  hearts(innerWidth / 2, innerHeight * .75, 18, innerWidth * .8, $('#pokeOv'));
}
function closePoke(){ $('#pokeOv').classList.add('hide'); }

/* ============ 8. Sheets ============ */
let scrollY = 0, openSheetEl = null;
function lockScroll(){ scrollY = window.scrollY; Object.assign(document.body.style, {position:'fixed', top:`-${scrollY}px`, left:'0', right:'0'}); }
function unlockScroll(){ Object.assign(document.body.style, {position:'', top:'', left:'', right:''}); window.scrollTo(0, scrollY); }
function showSheet(el){ openSheetEl = el; lockScroll(); $('#scrim').classList.add('show'); el.classList.add('show'); el.scrollTop = 0; }
function closeSheet(){
  if(!openSheetEl) return;
  $('#scrim').classList.remove('show'); openSheetEl.classList.remove('show');
  openSheetEl = null; unlockScroll(); state.editing = null; state.draftIdeaId = '';
}

function paintWho(){
  const me = meKey();
  $('#f-who').innerHTML = [me, other(me), 'both'].map(w =>
    `<button type="button" data-who="${w}" class="w-${w} ${state.draftWho===w?'on':''}">${esc(w==='both' ? 'Both of us' : nameOf(w))}</button>`).join('');
}
function paintKinds(){
  $('#f-kinds').innerHTML = KIND_GROUPS.map(([g, keys]) => `<div class="kgroup">${g}</div><div class="kinds">${
    keys.map(k => `<button type="button" data-kind="${k}" class="${state.draftKind===k?'on':''}">${KINDS[k].e} ${KINDS[k].l}</button>`).join('')}</div>`).join('');
}
function paintFreq(){
  $('#f-freq').innerHTML = FREQS.map(([k,l]) => `<button type="button" data-freq="${k}" class="${state.draftFreq===k?'on':''}">${l}</button>`).join('');
}
function syncToggles(){
  $('#timeRow').classList.toggle('hide', $('#f-allday').checked);
  $('#repeatBox').classList.toggle('hide', !$('#f-repeat').checked);
  $('#f-jar').classList.toggle('hide', !state.ideas.some(i => !i.done));
}
function openEventSheet(ev, preset = {}){
  const e = ev || {who: preset.who || meKey(), kind: preset.kind || 'plans', date: preset.date || state.selected,
                   title: preset.title || '', start: preset.start || '09:00', end: preset.end || '', allDay: !!preset.allDay};
  state.editing = ev || null;
  state.draftWho = e.who; state.draftKind = e.kind;
  state.draftFreq = repeats(e) ? e.repeat : 'weekly';
  state.draftIdeaId = preset.ideaId || '';
  $('#sheetTitle').textContent = ev ? 'Edit' : 'Add to calendar';
  $('#f-title').value = e.title || '';
  $('#f-date').value = e.date;
  $('#f-end').value = e.endDate || e.date;
  $('#f-allday').checked = !!e.allDay;
  $('#f-start').value = e.start || '';
  $('#f-endt').value = e.end || '';
  $('#f-repeat').checked = repeats(e);
  $('#f-until').value = e.until || '';
  $('#f-note').value = e.note || '';
  const del = $('#f-del'); del.classList.toggle('hide', !ev); del.textContent = 'Delete'; del.dataset.armed = '';
  paintWho(); paintKinds(); paintFreq(); syncToggles();
  showSheet($('#sheet'));
}
function planIdea(idea){
  const c = IDEA_CATS[idea.cat] || IDEA_CATS.out;
  openEventSheet(null, {who:'both', kind:c.kind, title:idea.text, date:nextFreeEvening(), start:'19:00', end:'21:00', allDay:c.kind === 'travel', ideaId:idea.id});
}
function submitEvent(){
  const date = $('#f-date').value;
  const endDate = $('#f-end').value || date;
  const allDay = $('#f-allday').checked, start = $('#f-start').value, end = $('#f-endt').value;
  if(!date) return toast('Pick a start date');
  if(endDate < date) return toast('End date is before the start date');
  if(!allDay && !start) return toast('Add a start time, or turn on All day');
  const repeat = $('#f-repeat').checked ? state.draftFreq : 'none';
  const until = repeat !== 'none' ? $('#f-until').value : '';
  if(until && until < date) return toast('Repeat end is before the start date');
  const wasEditing = !!state.editing;
  const ev = {
    id: wasEditing ? state.editing.id : uid(),
    title: $('#f-title').value.trim(), who: state.draftWho, kind: state.draftKind,
    date, endDate: endDate > date ? endDate : '', allDay, start: allDay ? '' : start, end: allDay ? '' : end,
    repeat, until, note: $('#f-note').value.trim(),
    createdBy: wasEditing ? (state.editing.createdBy || meKey()) : meKey(),
    createdAt: wasEditing ? (state.editing.createdAt || Date.now()) : Date.now(), updatedAt: Date.now()
  };
  const ideaId = state.draftIdeaId;
  saveEvent(ev);
  if(ideaId){ const idea = state.ideas.find(i => i.id === ideaId); if(idea) saveIdea({...idea, done:true, doneAt:Date.now()}); state.pulled = null; }
  closeSheet();
  toast(ideaId ? 'Planned, and moved out of the jar' : wasEditing ? 'Saved' : 'Added');
  state.selected = date; state.month = new Date(parse(date).getFullYear(), parse(date).getMonth(), 1);
  render();
}

function openStatusSheet(){
  const cur = statusOf(meKey());
  state.draftStatus = cur ? STATUSES.findIndex(s => s[1] === cur.text) : -1;
  $('#st-custom').value = cur && state.draftStatus < 0 ? cur.text : '';
  paintPresets();
  showSheet($('#stSheet'));
}
function paintPresets(){
  $('#presets').innerHTML = STATUSES.map(([e,l], i) => `<button type="button" data-st="${i}" class="${state.draftStatus===i?'on':''}">${e} ${l}</button>`).join('');
}
function setStatus(emoji, text){
  saveSettings({status:{[meKey()]:{emoji, text, day:todayStr(), at:Date.now()}}});
  closeSheet(); toast(text ? 'Status set' : 'Status cleared');
}

/* ============ 9. Interaction ============ */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1900); }
function applyTheme(){
  const t = localStorage.getItem('duet-theme') || 'auto';
  if(t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
function shiftMonth(n){ state.month = new Date(state.month.getFullYear(), state.month.getMonth()+n, 1); renderGrid(); }
function goView(v){ state.view = v; window.scrollTo(0,0); render(); }

document.addEventListener('click', evt => {
  const t = evt.target;
  const day = t.closest('.day');
  if(day){ state.selected = day.dataset.date;
    const d = parse(day.dataset.date);
    if(d.getMonth() !== state.month.getMonth()) state.month = new Date(d.getFullYear(), d.getMonth(), 1);
    renderGrid(); renderPanel(); return; }
  const item = t.closest('.blk, .chip');
  if(item){ const found = state.events.find(x => x.id === item.dataset.id); if(found) openEventSheet(found); return; }
  const plan = t.closest('[data-plan]');
  if(plan){ openEventSheet(null, {who:'both', kind:'date', date:plan.dataset.plan, start:'19:00', end:'21:00'}); return; }
  const hit = t.closest('.tl-hit');
  if(hit){
    const r = hit.getBoundingClientRect();
    const m = Math.min(Number(hit.dataset.r0) + Math.floor((evt.clientY - r.top) / Number(hit.dataset.px) * 2) * 30, 23*60);
    openEventSheet(null, {who:hit.dataset.hit, date:hit.dataset.ds, start:fromMin(m), end:fromMin(Math.min(m + 60, 23*60 + 59))});
    return;
  }
  const tab = t.closest('#tabs button');
  if(tab){ goView(tab.dataset.view); return; }
  const who = t.closest('[data-who]');
  if(who){ state.draftWho = who.dataset.who; paintWho(); return; }
  const kind = t.closest('[data-kind]');
  if(kind){ state.draftKind = kind.dataset.kind;
    if(kind.dataset.kind === 'date' && state.draftWho !== 'both'){ state.draftWho = 'both'; paintWho(); }
    if(ALLDAY_KINDS.has(kind.dataset.kind)){ $('#f-allday').checked = true; syncToggles(); }
    paintKinds(); return; }
  const freq = t.closest('[data-freq]');
  if(freq){ state.draftFreq = freq.dataset.freq; paintFreq(); return; }
  const meBtn = t.closest('[data-me]');
  if(meBtn){ state.me = meBtn.dataset.me; localStorage.setItem('duet-me', state.me);
    localStorage.setItem('duet-poke-seen', String(Date.now())); render(); return; }
  const th = t.closest('[data-theme-pick]');
  if(th){ localStorage.setItem('duet-theme', th.dataset.themePick); applyTheme(); render(); return; }
  if(t.closest('#stEdit')){ openStatusSheet(); return; }
  if(t.closest('#pokeBtn')){ sendPoke(t.closest('#pokeBtn')); return; }
  const st = t.closest('[data-st]');
  if(st){ state.draftStatus = Number(st.dataset.st); $('#st-custom').value = ''; paintPresets(); return; }
  // jar
  const jc = t.closest('[data-jcat]');
  if(jc){ state.jarCat = jc.dataset.jcat; state.pulled = null; renderJar(); return; }
  const ic = t.closest('[data-icat]');
  if(ic){ state.ideaCat = ic.dataset.icat; document.querySelectorAll('[data-icat]').forEach(b => b.classList.toggle('on', b === ic)); return; }
  if(t.closest('[data-pull]')){
    const pool = state.ideas.filter(i => !i.done && (state.jarCat === 'any' || i.cat === state.jarCat));
    const choices = pool.length > 1 ? pool.filter(i => i.id !== state.pulled) : pool;
    state.pulled = choices.length ? choices[Math.floor(Math.random() * choices.length)].id : null;
    renderJar(); return;
  }
  const ip = t.closest('[data-idea-plan]');
  if(ip){ const idea = state.ideas.find(i => i.id === ip.dataset.ideaPlan); if(idea) planIdea(idea); return; }
  const idn = t.closest('[data-idea-done]');
  if(idn){ const idea = state.ideas.find(i => i.id === idn.dataset.ideaDone); if(idea){ saveIdea({...idea, done:true, doneAt:Date.now()}); toast('Moved to “We did these”'); } return; }
  const ib = t.closest('[data-idea-back]');
  if(ib){ const idea = state.ideas.find(i => i.id === ib.dataset.ideaBack); if(idea){ saveIdea({...idea, done:false, doneAt:0}); toast('Back in the jar'); } return; }
  const idl = t.closest('[data-idea-del]');
  if(idl){
    if(!idl.classList.contains('armed')){ idl.classList.add('armed'); idl.textContent = 'Delete?'; return; }
    deleteIdea(idl.dataset.ideaDel); if(state.pulled === idl.dataset.ideaDel) state.pulled = null; toast('Idea deleted'); return;
  }
  if(t.closest('#ideaAdd')){
    const text = $('#ideaIn').value.trim(); if(!text) return toast('Type an idea first');
    saveIdea({id:uid(), text, cat:state.ideaCat, by:meKey(), createdAt:Date.now(), done:false, doneAt:0});
    const inp = $('#ideaIn'); if(inp) inp.value = ''; toast('Added to the jar'); return;
  }
  if(t.closest('#ob-go')){
    const mine = $('#ob-me').value.trim(), theirs = $('#ob-them').value.trim();
    if(!mine || !theirs) return toast('Add both names');
    state.me = 'a'; localStorage.setItem('duet-me', 'a');
    saveSettings({nameA: mine, nameB: theirs}); return;
  }
  if(t.closest('#noteSave')){
    const text = $('#noteIn').value.trim(); if(!text) return toast('Write something first');
    saveSettings({note:{text, by:meKey(), at:Date.now()}}); $('#noteIn').value = ''; toast('Note left'); return;
  }
  if(t.closest('#s-save')){
    const a = $('#s-a').value.trim(), b = $('#s-b').value.trim();
    if(!a || !b) return toast('Both names are needed');
    saveSettings({nameA:a, nameB:b, since:$('#s-since').value || ''}); toast('Settings saved'); return;
  }
});
$('#letter').addEventListener('click', () => goView('us'));
$('#fab').addEventListener('click', () => openEventSheet(null));
$('#prev').addEventListener('click', () => shiftMonth(-1));
$('#next').addEventListener('click', () => shiftMonth(1));
function goToday(){ const d = new Date(); state.month = new Date(d.getFullYear(), d.getMonth(), 1); state.selected = ymd(d); renderGrid(); renderPanel(); }
$('#mtitle').addEventListener('click', goToday);
$('#todayBtn').addEventListener('click', goToday);
$('#scrim').addEventListener('click', closeSheet);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
// Swipe down to close (when the sheet is scrolled to the top)
document.querySelectorAll('.sheet').forEach(sheet => {
  let y0 = null, dy = 0, dragging = false;
  sheet.addEventListener('touchstart', e => { y0 = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; dragging = false; }, {passive:true});
  sheet.addEventListener('touchmove', e => {
    if(y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if(!dragging){
      if(dy < -4){ y0 = null; return; }
      if(dy > 8 && sheet.scrollTop <= 0){ dragging = true; sheet.style.transition = 'none'; }
    }
    if(dragging){ if(e.cancelable) e.preventDefault(); sheet.style.transform = `translateY(${Math.max(0, dy)}px)`; }
  }, {passive:false});
  const end = () => {
    if(dragging){ sheet.style.transition = ''; sheet.style.transform = ''; if(dy > 110) closeSheet(); }
    y0 = null; dragging = false;
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
});
$('#f-cancel').addEventListener('click', closeSheet);
$('#f-save').addEventListener('click', submitEvent);
$('#f-allday').addEventListener('change', syncToggles);
$('#f-repeat').addEventListener('change', syncToggles);
$('#f-date').addEventListener('change', () => { if(!$('#f-end').value || $('#f-end').value < $('#f-date').value) $('#f-end').value = $('#f-date').value; });
$('#f-jar').addEventListener('click', () => {
  const pool = state.ideas.filter(i => !i.done); if(!pool.length) return;
  const idea = pool[Math.floor(Math.random() * pool.length)], c = IDEA_CATS[idea.cat] || IDEA_CATS.out;
  $('#f-title').value = idea.text; state.draftIdeaId = idea.id; state.draftKind = c.kind; state.draftWho = 'both';
  if(c.kind === 'travel'){ $('#f-allday').checked = true; syncToggles(); }
  paintKinds(); paintWho(); toast('Picked from the jar');
});
$('#f-del').addEventListener('click', () => {
  const b = $('#f-del');
  if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = repeats(state.editing) ? 'Delete all repeats?' : 'Tap to confirm'; return; }
  deleteEvent(state.editing.id); closeSheet(); toast('Deleted');
});
$('#st-save').addEventListener('click', () => {
  const custom = $('#st-custom').value.trim();
  if(custom) return setStatus('💬', custom);
  if(state.draftStatus >= 0) return setStatus(...STATUSES[state.draftStatus]);
  toast('Pick a status or write one');
});
$('#st-clear').addEventListener('click', () => setStatus('', ''));
$('#st-custom').addEventListener('input', () => { if(state.draftStatus >= 0){ state.draftStatus = -1; paintPresets(); } });
$('#pokeClose').addEventListener('click', closePoke);
$('#pokeBack').addEventListener('click', e => { sendPoke(e.currentTarget); closePoke(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeSheet(); closePoke(); } });

let tx = null;
$('#grid').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
$('#grid').addEventListener('touchend', e => {
  if(tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if(Math.abs(dx) > 60) shiftMonth(dx < 0 ? 1 : -1);
}, {passive:true});

document.addEventListener('visibilitychange', () => { if(!document.hidden) render(); });
setInterval(() => { if(!document.hidden && !openSheetEl && (state.view === 'cal' || state.view === 'week')) render(); }, 60000);

applyTheme();
initStore();
</script>
